# Cloudflare Pages Configuration for TeleGenie

name = "telegenie"
compatibility_date = "2024-01-01"

# Pages configuration
pages_build_output_dir = ".vercel/output/static"

# Environment variables (set these in Cloudflare dashboard or wrangler)
[env.production]
# NEXT_PUBLIC_API_BASE_URL = "https://api.telegenie.com"

[env.preview]
# NEXT_PUBLIC_API_BASE_URL = "https://api-preview.telegenie.com"

# Build configuration
[build]
command = "yarn workspace @telegenie/web build"

# Development configuration
[dev]
port = 4000
